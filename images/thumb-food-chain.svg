<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="foodChainBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2F4FD"/>
      <stop offset="50%" stop-color="#C7EBFD"/>
      <stop offset="100%" stop-color="#A9E7C4"/>
    </linearGradient>
    <filter id="thumbShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#273653" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#foodChainBg)"/>
  
  <!-- Sunny sky rays -->
  <circle cx="580" cy="50" r="70" fill="#FFD66B" opacity="0.6"/>
  <circle cx="580" cy="50" r="50" fill="#FFE885"/>

  <!-- Right side: The Food Chain Cycle graphic -->
  <g transform="translate(360, 50)" filter="url(#thumbShadow)">
    <!-- Base Card -->
    <rect x="0" y="0" width="250" height="260" rx="24" fill="#FFFFFF"/>
    
    <!-- Step 1: Sun & Green Plant -->
    <g transform="translate(35, 30)">
      <circle cx="25" cy="25" r="22" fill="#E8F8EE"/>
      <!-- Little sprout -->
      <path d="M 25 35 L 25 20 Q 15 15 25 15 Q 35 15 25 20" fill="#48BB78"/>
      <text x="58" y="28" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" fill="#273653">1. Plant (Producer)</text>
    </g>

    <!-- Arrow down -->
    <path d="M 60 85 L 60 100 L 68 100 L 60 110 L 52 100 L 60 100" fill="#70C9F0"/>

    <!-- Step 2: Cute Caterpillar -->
    <g transform="translate(35, 115)">
      <circle cx="25" cy="25" r="22" fill="#FFF3D6"/>
      <!-- Caterpillar segments -->
      <circle cx="15" cy="26" r="6" fill="#A9E7C4"/>
      <circle cx="23" cy="24" r="6" fill="#A9E7C4"/>
      <circle cx="31" cy="24" r="7" fill="#68D391"/>
      <circle cx="33" cy="22" r="1.5" fill="#273653"/>
      <text x="58" y="28" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" fill="#273653">2. Herbivore</text>
    </g>

    <!-- Arrow down -->
    <path d="M 60 170 L 60 185 L 68 185 L 60 195 L 52 185 L 60 185" fill="#70C9F0"/>

    <!-- Step 3: Friendly Robin Bird / Predator -->
    <g transform="translate(35, 200)">
      <circle cx="25" cy="25" r="22" fill="#FEEBE8"/>
      <!-- Bird -->
      <ellipse cx="24" cy="25" rx="10" ry="8" fill="#70C9F0"/>
      <circle cx="28" cy="20" r="6" fill="#FF8C78"/>
      <polygon points="34,20 39,21 34,23" fill="#FFD66B"/>
      <circle cx="29" cy="19" r="1" fill="#273653"/>
      <text x="58" y="28" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" fill="#273653">3. Predator!</text>
    </g>
  </g>

  <!-- Left Side: Typography -->
  <g transform="translate(40, 75)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#273653"/>
    <circle cx="17" cy="17" r="8" fill="#70C9F0"/>
    <text x="35" y="22" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">NATURE &amp; DISCOVERY</text>

    <!-- Heading -->
    <text x="0" y="85" font-family="'Fredoka', 'Baloo 2', sans-serif" font-size="44" font-weight="800" fill="#273653" letter-spacing="-0.5">
      The Food
    </text>
    <text x="0" y="135" font-family="'Fredoka', 'Baloo 2', sans-serif" font-size="44" font-weight="800" fill="#1C7ED6" letter-spacing="-0.5">
      Chain for Kids!
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" font-family="'Nunito', sans-serif" font-size="18" font-weight="700" fill="#273653">
      Plants to Predators: Who Eats Who in Nature?
    </text>

    <!-- Category Pill -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="165" height="32" rx="16" fill="#FFFFFF" filter="url(#thumbShadow)"/>
      <text x="82" y="21" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" fill="#1C7ED6" text-anchor="middle">🌿 NATURE EXPLORER</text>
    </g>
  </g>

  <rect x="545" y="315" width="80" height="30" rx="6" fill="#273653" opacity="0.9"/>
  <text x="585" y="335" font-family="'Nunito', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">EPISODE</text>
</svg>
