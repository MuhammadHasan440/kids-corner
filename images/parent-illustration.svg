<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="parentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9EF"/>
      <stop offset="100%" stop-color="#FFF0D4"/>
    </linearGradient>
    <filter id="pShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#273653" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="400" height="320" rx="32" fill="url(#parentBg)"/>

  <!-- Morning desk / kitchen table scene for parents -->
  <g transform="translate(60, 40)" filter="url(#pShadow)">
    <!-- Clipboard / Parenting Notes with Heart -->
    <rect x="20" y="30" width="170" height="220" rx="16" fill="#FFFFFF"/>
    <!-- Clip -->
    <rect x="80" y="18" width="50" height="20" rx="6" fill="#C9B6F2"/>
    <circle cx="105" cy="28" r="4" fill="#FFFFFF"/>

    <!-- Handwritten lines on notebook -->
    <rect x="40" y="60" width="130" height="10" rx="5" fill="#EBF7FD"/>
    <text x="45" y="68" font-family="'Nunito', sans-serif" font-size="9" font-weight="800" fill="#273653">TODAY'S "YET" MOMENT:</text>
    
    <line x1="40" y1="95" x2="170" y2="95" stroke="#E2DAC9" stroke-width="2"/>
    <line x1="40" y1="125" x2="170" y2="125" stroke="#E2DAC9" stroke-width="2"/>
    <line x1="40" y1="155" x2="170" y2="155" stroke="#E2DAC9" stroke-width="2"/>
    <line x1="40" y1="185" x2="170" y2="185" stroke="#E2DAC9" stroke-width="2"/>

    <!-- Child's colorful crayon drawing on paper -->
    <path d="M 50 140 Q 75 110 100 140" fill="none" stroke="#FF8C78" stroke-width="4" stroke-linecap="round"/>
    <path d="M 60 142 Q 75 125 90 142" fill="none" stroke="#FFD66B" stroke-width="4" stroke-linecap="round"/>
    <polygon points="135,115 140,122 148,124 142,130 144,138 135,133 126,138 128,130 122,124 130,122" fill="#FFD66B"/>
    <text x="45" y="210" font-family="'Fredoka', cursive, sans-serif" font-size="12" font-weight="700" fill="#FF8C78">"We haven't figured it out YET!"</text>

    <!-- Warm Coffee / Tea Mug for Mom on right -->
    <g transform="translate(180, 110)">
      <rect x="25" y="40" width="65" height="75" rx="14" fill="#70C9F0"/>
      <!-- Mug handle -->
      <path d="M 90 55 C 112 55, 112 100, 90 100" fill="none" stroke="#70C9F0" stroke-width="10" stroke-linecap="round"/>
      <!-- Heart on mug -->
      <path d="M 57 70 C 57 65, 50 60, 46 68 C 42 60, 35 65, 35 70 C 35 80, 46 88, 46 88 C 46 88, 57 80, 57 70 Z" fill="#FFFFFF"/>
      <!-- Steam swirls -->
      <path d="M 45 32 Q 40 22 48 12" fill="none" stroke="#FFD66B" stroke-width="3" stroke-linecap="round"/>
      <path d="M 60 30 Q 68 20 60 10" fill="none" stroke="#FFD66B" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
