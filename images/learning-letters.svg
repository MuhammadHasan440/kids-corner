<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="32" fill="#EBF7FD"/>
  <!-- Open ABC book and dancing letters -->
  <g transform="translate(20, 20)">
    <!-- Book open base -->
    <path d="M 10 65 Q 40 55 40 30 Q 40 55 70 65 L 70 30 Q 40 20 40 -5 Q 40 20 10 30 Z" fill="#70C9F0" opacity="0.3"/>
    <rect x="15" y="35" width="50" height="35" rx="8" fill="#FFFFFF"/>
    <!-- Big friendly A and B -->
    <text x="27" y="60" font-family="'Fredoka', sans-serif" font-size="28" font-weight="900" fill="#70C9F0">A</text>
    <text x="47" y="60" font-family="'Fredoka', sans-serif" font-size="28" font-weight="900" fill="#FF8C78">b</text>
    <!-- Little pencil on side -->
    <polygon points="62,10 68,2 74,10 68,18" fill="#FFD66B"/>
    <rect x="58" y="14" width="8" height="24" rx="2" transform="rotate(-30 58 14)" fill="#FFD66B"/>
  </g>
</svg>
