<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="yetSongBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E5"/>
      <stop offset="50%" stop-color="#FFD66B"/>
      <stop offset="100%" stop-color="#C9B6F2"/>
    </linearGradient>
    <filter id="thumbShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#273653" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#yetSongBg)"/>

  <!-- Rainbow arch in background -->
  <g transform="translate(420, 80)" opacity="0.4">
    <path d="M 0 160 A 100 100 0 0 1 200 160" fill="none" stroke="#FF8C78" stroke-width="12"/>
    <path d="M 12 160 A 88 88 0 0 1 188 160" fill="none" stroke="#FFD66B" stroke-width="12"/>
    <path d="M 24 160 A 76 76 0 0 1 176 160" fill="none" stroke="#A9E7C4" stroke-width="12"/>
    <path d="M 36 160 A 64 64 0 0 1 164 160" fill="none" stroke="#70C9F0" stroke-width="12"/>
  </g>

  <!-- Right side: Giant Golden YET Star Badge & Musical Notes -->
  <g transform="translate(420, 85)" filter="url(#thumbShadow)">
    <circle cx="90" cy="90" r="85" fill="#FFEAA7"/>
    <circle cx="90" cy="90" r="75" fill="#FFF9EF"/>

    <!-- Golden Star -->
    <polygon points="90,25 106,68 152,68 116,94 130,138 90,112 50,138 64,94 28,68 74,68" fill="#FFA827" stroke="#E58A15" stroke-width="3" stroke-linejoin="round"/>
    
    <!-- YET Text in Star -->
    <text x="90" y="105" font-family="'Fredoka', 'Baloo 2', sans-serif" font-size="34" font-weight="900" fill="#273653" text-anchor="middle">YET!</text>
    
    <!-- Sparkles and musical notes -->
    <text x="10" y="40" font-family="'Fredoka', sans-serif" font-size="32" fill="#FF8C78">♪</text>
    <text x="155" y="150" font-family="'Fredoka', sans-serif" font-size="38" fill="#70C9F0">♫</text>
  </g>

  <!-- Left Side: Typography -->
  <g transform="translate(40, 75)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#273653"/>
    <circle cx="17" cy="17" r="8" fill="#C9B6F2"/>
    <text x="35" y="22" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">GROWTH MINDSET</text>

    <!-- Heading -->
    <text x="0" y="85" font-family="'Fredoka', 'Baloo 2', sans-serif" font-size="44" font-weight="800" fill="#273653" letter-spacing="-0.5">
      The Power
    </text>
    <text x="0" y="135" font-family="'Fredoka', 'Baloo 2', sans-serif" font-size="44" font-weight="800" fill="#6B46C1" letter-spacing="-0.5">
      of YET! Song
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" font-family="'Nunito', sans-serif" font-size="18" font-weight="700" fill="#273653">
      Turn "I Can't Do It" into "I Can't Do It YET!"
    </text>

    <!-- Category Pill -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="165" height="32" rx="16" fill="#FFFFFF" filter="url(#thumbShadow)"/>
      <text x="82" y="21" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" fill="#6B46C1" text-anchor="middle">✨ MINDSET ANTHEM</text>
    </g>
  </g>

  <rect x="545" y="315" width="80" height="30" rx="6" fill="#273653" opacity="0.9"/>
  <text x="585" y="335" font-family="'Nunito', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ANTHEM</text>
</svg>
