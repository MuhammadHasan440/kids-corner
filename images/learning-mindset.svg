<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <rect width="120" height="120" rx="32" fill="#F4EEFD"/>
  <!-- Growth mindset star & sprouting seedling -->
  <g transform="translate(18, 18)">
    <!-- Sprouting heart plant -->
    <path d="M 42 75 L 42 50 Q 25 45 42 35 Q 60 45 42 50" fill="#A9E7C4"/>
    <ellipse cx="42" cy="74" rx="22" ry="8" fill="#E2D4FA"/>

    <!-- Glowing star on top with word YET -->
