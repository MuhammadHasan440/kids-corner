    <text x="42" y="33" font-family="'Fredoka', sans-serif" font-size="10" font-weight="900" fill="#273653" text-anchor="middle">YET</text>

    <!-- Sparkle rays -->
    <circle cx="15" cy="20" r="3" fill="#FF8C78"/>
    <circle cx="70" cy="25" r="3" fill="#70C9F0"/>
  </g>
