<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="muffinBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE8B2"/>
      <stop offset="50%" stop-color="#FFD66B"/>
      <stop offset="100%" stop-color="#FFA857"/>
    </linearGradient>
    <filter id="thumbShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#273653" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#muffinBg)"/>
  
  <!-- Bakery counter and bunting decoration -->
  <g opacity="0.4">
    <circle cx="100" cy="50" r="80" fill="#FFFFFF"/>
    <circle cx="560" cy="80" r="100" fill="#FFFFFF"/>
  </g>

  <!-- Bunting flags across top -->
  <polygon points="40,0 70,40 100,0" fill="#FF8C78"/>
  <polygon points="100,0 130,40 160,0" fill="#70C9F0"/>
  <polygon points="160,0 190,40 220,0" fill="#A9E7C4"/>
  <polygon points="220,0 250,40 280,0" fill="#C9B6F2"/>
  <polygon points="280,0 310,40 340,0" fill="#FF8C78"/>
  <polygon points="340,0 370,40 400,0" fill="#70C9F0"/>
  <polygon points="400,0 430,40 460,0" fill="#A9E7C4"/>
  <polygon points="460,0 490,40 520,0" fill="#FFD66B"/>
  <polygon points="520,0 550,40 580,0" fill="#C9B6F2"/>

  <!-- Drury Lane Bakery Illustration -->
  <g transform="translate(380, 110)" filter="url(#thumbShadow)">
    <!-- Giant Smiling Muffin Character -->
    <path d="M 40 180 L 140 180 L 125 100 L 55 100 Z" fill="#F4EDE0" stroke="#CBBBA2" stroke-width="3"/>
    <!-- Lines on muffin cup -->
    <line x1="70" y1="100" x2="60" y2="180" stroke="#CBBBA2" stroke-width="2"/>
    <line x1="90" y1="100" x2="90" y2="180" stroke="#CBBBA2" stroke-width="2"/>
    <line x1="110" y1="100" x2="120" y2="180" stroke="#CBBBA2" stroke-width="2"/>

    <!-- Puffy Golden Muffin Top -->
    <path d="M 30 105 C 10 90, 20 40, 50 45 C 60 20, 120 15, 130 45 C 160 35, 175 90, 150 105 Z" fill="#E28938" stroke="#BF6B20" stroke-width="3"/>
    <!-- Blueberry dots -->
    <circle cx="65" cy="55" r="7" fill="#4B5EAA"/>
    <circle cx="110" cy="50" r="8" fill="#4B5EAA"/>
    <circle cx="85" cy="80" r="7" fill="#4B5EAA"/>
    <circle cx="135" cy="75" r="6" fill="#4B5EAA"/>

    <!-- Chef Hat on Muffin -->
    <path d="M 75 30 C 65 0, 115 -5, 115 30 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
    <rect x="75" y="24" width="40" height="12" rx="3" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>

    <!-- Smiling face on Muffin -->
    <circle cx="75" cy="130" r="5" fill="#273653"/>
    <circle cx="105" cy="130" r="5" fill="#273653"/>
    <circle cx="77" cy="128" r="1.8" fill="#FFFFFF"/>
    <circle cx="107" cy="128" r="1.8" fill="#FFFFFF"/>
    <path d="M 80 145 Q 90 155 100 145" fill="none" stroke="#273653" stroke-width="3" stroke-linecap="round"/>
    <circle cx="67" cy="138" r="4" fill="#FF8C78" opacity="0.6"/>
    <circle cx="113" cy="138" r="4" fill="#FF8C78" opacity="0.6"/>

    <!-- Musical notes around muffin -->
    <text x="-30" y="80" font-family="'Fredoka', sans-serif" font-size="28" fill="#FF8C78">♪</text>
    <text x="165" y="60" font-family="'Fredoka', sans-serif" font-size="34" fill="#70C9F0">♫</text>
  </g>

  <!-- Left Side Typography & Badges -->
  <g transform="translate(40, 75)">
    <!-- Channel & Series Badge -->
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#273653"/>
    <circle cx="17" cy="17" r="8" fill="#FFD66B"/>
    <text x="35" y="22" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">KIDZ CORNER WITH HAVEN</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="'Fredoka', 'Baloo 2', sans-serif" font-size="44" font-weight="800" fill="#273653" letter-spacing="-0.5">
      The Muffin
    </text>
    <text x="0" y="135" font-family="'Fredoka', 'Baloo 2', sans-serif" font-size="44" font-weight="800" fill="#FF5E42" letter-spacing="-0.5">
      Man Song!
    </text>
    
    <!-- Subtitle / Tagline -->
    <text x="0" y="175" font-family="'Nunito', sans-serif" font-size="18" font-weight="700" fill="#273653">
      Nursery Rhyme Sing-Along on Drury Lane
    </text>

    <!-- Category Pill -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="165" height="32" rx="16" fill="#FFFFFF" filter="url(#thumbShadow)"/>
      <text x="82" y="21" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" fill="#FF8C78" text-anchor="middle">🎶 NURSERY RHYMES</text>
    </g>
  </g>

  <!-- Duration Badge in Corner -->
  <rect x="545" y="315" width="80" height="30" rx="6" fill="#273653" opacity="0.9"/>
  <text x="585" y="335" font-family="'Nunito', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">FEATURED</text>
</svg>
