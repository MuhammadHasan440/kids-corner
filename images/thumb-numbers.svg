<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="numBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F4FD"/>
      <stop offset="50%" stop-color="#C2E6FC"/>
      <stop offset="100%" stop-color="#70C9F0"/>
    </linearGradient>
    <filter id="thumbShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#273653" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#numBg)"/>

  <!-- Fun numbers background shapes -->
  <circle cx="80" cy="50" r="40" fill="#FFFFFF" opacity="0.25"/>
  <circle cx="560" cy="80" r="70" fill="#FFFFFF" opacity="0.3"/>
  <text x="50" y="320" font-family="'Fredoka', sans-serif" font-size="64" fill="#FFFFFF" opacity="0.3">1 2 3</text>

  <!-- Right side: Stepping Stones & Math Riddles -->
  <g transform="translate(370, 70)" filter="url(#thumbShadow)">
    <!-- Stepping Stone 1 -->
    <ellipse cx="60" cy="180" rx="45" ry="22" fill="#FFD66B"/>
    <text x="60" y="188" font-family="'Fredoka', sans-serif" font-size="32" font-weight="900" fill="#273653" text-anchor="middle">1</text>

    <!-- Stepping Stone 2 -->
    <ellipse cx="140" cy="130" rx="45" ry="22" fill="#A9E7C4"/>
    <text x="140" y="138" font-family="'Fredoka', sans-serif" font-size="32" font-weight="900" fill="#273653" text-anchor="middle">2</text>

    <!-- Stepping Stone 3 -->
    <ellipse cx="180" cy="65" rx="45" ry="22" fill="#FF8C78"/>
    <text x="180" y="73" font-family="'Fredoka', sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">3</text>

    <!-- Big Riddle Question Mark Badge -->
    <g transform="translate(20, 20)">
      <circle cx="35" cy="35" r="30" fill="#C9B6F2" stroke="#FFFFFF" stroke-width="4"/>
      <text x="35" y="47" font-family="'Fredoka', sans-serif" font-size="42" font-weight="900" fill="#273653" text-anchor="middle">?</text>
    </g>
  </g>

  <!-- Left Side: Typography -->
  <g transform="translate(40, 75)">
    <!-- Badge -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#273653"/>
    <circle cx="17" cy="17" r="8" fill="#FFD66B"/>
    <text x="35" y="22" font-family="'Nunito', sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">NUMBERS &amp; DISCOVERY</text>

    <!-- Heading -->
    <text x="0" y="85" font-family="'Fredoka', 'Baloo 2', sans-serif" font-size="44" font-weight="800" fill="#273653" letter-spacing="-0.5">
      Fun Counting &amp;
    </text>
    <text x="0" y="135" font-family="'Fredoka', 'Baloo 2', sans-serif" font-size="44" font-weight="800" fill="#0C7AB2" letter-spacing="-0.5">
      Math Riddles!
    </text>

    <!-- Subtitle -->
    <text x="0" y="175" font-family="'Nunito', sans-serif" font-size="18" font-weight="700" fill="#273653">
      Playful Puzzles, Shapes &amp; Early Number Confidence
    </text>

    <!-- Category Pill -->
    <g transform="translate(0, 195)">
      <rect x="0" y="0" width="165" height="32" rx="16" fill="#FFFFFF" filter="url(#thumbShadow)"/>
      <text x="82" y="21" font-family="'Nunito', sans-serif" font-size="13" font-weight="800" fill="#0C7AB2" text-anchor="middle">🔢 EARLY MATH</text>
    </g>
  </g>

  <rect x="545" y="315" width="80" height="30" rx="6" fill="#273653" opacity="0.9"/>
  <text x="585" y="335" font-family="'Nunito', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">RIDDLES</text>
</svg>
